<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Пример графика производства работ с планом и фактом</title>
  <desc id="desc">Диаграмма показывает базовый план, выполненный факт и обновленный прогноз по пяти связанным строительным работам.</desc>
  <defs>
    <style>.bg{fill:#f7f5ef}.ink{fill:#18202a}.muted{fill:#64707b}.grid{stroke:#dedbd4;stroke-width:1}.major{stroke:#b9b5ad;stroke-width:2}.plan{fill:#d8e2e8}.fact{fill:#315c73}.forecast{fill:#e96c38}.risk{fill:#f4d7ca}.t1{font:700 30px Arial,sans-serif}.t2{font:700 18px Arial,sans-serif}.t3{font:400 16px Arial,sans-serif}.small{font:400 14px Arial,sans-serif}</style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text x="60" y="66" class="t1 ink">План, факт и прогноз — три разные линии</text>
  <text x="60" y="100" class="t3 muted">Учебный пример. Даты и объемы условные.</text>
  <rect x="50" y="140" width="1100" height="452" rx="18" fill="#fff" stroke="#d8d5cd" stroke-width="2"/>

  <text x="75" y="184" class="t2 ink">Работа</text>
  <text x="418" y="176" class="small muted">12 авг</text><text x="518" y="176" class="small muted">14 авг</text><text x="618" y="176" class="small muted">16 авг</text><text x="718" y="176" class="small muted">18 авг</text><text x="818" y="176" class="small muted">20 авг</text><text x="918" y="176" class="small muted">22 авг</text><text x="1018" y="176" class="small muted">24 авг</text>
  <line x1="390" y1="194" x2="1120" y2="194" class="major"/>
  <line x1="390" y1="194" x2="390" y2="565" class="major"/>
  <path d="M440 194v371M490 194v371M540 194v371M590 194v371M640 194v371M690 194v371M740 194v371M790 194v371M840 194v371M890 194v371M940 194v371M990 194v371M1040 194v371M1090 194v371" class="grid"/>
  <path d="M50 270h1100M50 344h1100M50 418h1100M50 492h1100" class="grid"/>

  <text x="75" y="235" class="t3 ink">Основание</text><text x="75" y="257" class="small muted">участок А</text>
  <rect x="410" y="214" width="170" height="14" rx="7" class="plan"/><rect x="410" y="236" width="180" height="14" rx="7" class="fact"/>

  <text x="75" y="309" class="t3 ink">Армирование</text><text x="75" y="331" class="small muted">плита</text>
  <rect x="560" y="288" width="170" height="14" rx="7" class="plan"/><rect x="590" y="310" width="170" height="14" rx="7" class="fact"/>

  <text x="75" y="383" class="t3 ink">Бетонирование</text><text x="75" y="405" class="small muted">контрольная веха</text>
  <rect x="710" y="362" width="90" height="14" rx="7" class="plan"/><rect x="760" y="384" width="100" height="14" rx="7" class="forecast"/>

  <text x="75" y="457" class="t3 ink">Набор прочности</text><text x="75" y="479" class="small muted">технологическое ожидание</text>
  <rect x="790" y="436" width="160" height="14" rx="7" class="plan"/><rect x="850" y="458" width="160" height="14" rx="7" class="forecast"/>

  <text x="75" y="531" class="t3 ink">Следующий фронт</text><text x="75" y="553" class="small muted">старт последующей работы</text>
  <rect x="940" y="510" width="110" height="14" rx="7" class="plan"/><rect x="1010" y="532" width="100" height="14" rx="7" class="forecast"/>

  <rect x="720" y="204" width="142" height="330" rx="10" class="risk" opacity=".36"/>
  <text x="728" y="554" class="small forecast">отклонение меняет цепочку</text>

  <rect x="60" y="625" width="18" height="12" rx="6" class="plan"/><text x="88" y="636" class="small muted">базовый план</text>
  <rect x="225" y="625" width="18" height="12" rx="6" class="fact"/><text x="253" y="636" class="small muted">подтвержденный факт</text>
  <rect x="445" y="625" width="18" height="12" rx="6" class="forecast"/><text x="473" y="636" class="small muted">текущий прогноз</text>
  <text x="790" y="636" class="small ink">Базовые даты не перезаписываются прогнозом</text>
</svg>
