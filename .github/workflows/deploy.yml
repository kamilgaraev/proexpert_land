name: Deploy МОСТ Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: both
        type: choice
        options:
          - both
          - marketing
          - lk
          - backup-marketing
          - verify-marketing-backup
          - restore-marketing-backup
          - backup-lk
          - verify-lk-backup
          - restore-lk-backup
      confirm_restore:
        description: Enter RESTORE-MARKETING-20260902 or RESTORE-LK-20260904 for the matching baseline
        required: false
        type: string

concurrency:
  group: prohelper-frontend-deploy
  cancel-in-progress: false

jobs:
  marketing-baseline:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'backup-marketing' || inputs.target == 'verify-marketing-backup' || inputs.target == 'restore-marketing-backup')
    runs-on: ubuntu-latest
    steps:
      - name: Validate restore request
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_RESTORE: ${{ inputs.confirm_restore }}
        run: |
          if [ "$TARGET" = restore-marketing-backup ] && [ "$CONFIRM_RESTORE" != RESTORE-MARKETING-20260902 ]; then
            exit 1
          fi
      - name: Preserve or restore marketing baseline
        uses: appleboy/ssh-action@v1.2.0
        env:
          BASELINE_OPERATION: ${{ inputs.target }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          envs: BASELINE_OPERATION
          command_timeout: 20m
          script: |
            set -euo pipefail
            umask 077
            RELEASES_ROOT=/var/www/prohelper_marketing/releases
            CURRENT_LINK=/var/www/prohelper_marketing/current
            BACKUP_ROOT=/var/backups/most-marketing
            BASELINE="$BACKUP_ROOT/before-redesign-20260902"
            CURRENT_RELEASE="$(readlink -f "$CURRENT_LINK")"
            case "$CURRENT_RELEASE" in
              "$RELEASES_ROOT"/*) ;;
              *) echo 'Unexpected marketing release path'; exit 1 ;;
            esac
            test -d "$CURRENT_RELEASE/server"
            test -d "$CURRENT_RELEASE/client"
            test -f "$CURRENT_RELEASE/ecosystem.config.cjs"
            mkdir -p "$BACKUP_ROOT"
            if [ "$BASELINE_OPERATION" = backup-marketing ] && [ ! -e "$BASELINE" ]; then
              STAGING="$(mktemp -d "$BACKUP_ROOT/.baseline-20260902.XXXXXX")"
              tar -czf "$STAGING/release.tgz" -C "$CURRENT_RELEASE" .
              tar -dzf "$STAGING/release.tgz" -C "$CURRENT_RELEASE"
              printf '%s\n' "$CURRENT_RELEASE" > "$STAGING/original-release.txt"
              date -u +%FT%TZ > "$STAGING/created-at.txt"
              (cd "$STAGING" && sha256sum release.tgz > SHA256SUMS)
              mv -T "$STAGING" "$BASELINE"
            fi
            test -d "$BASELINE"
            (cd "$BASELINE" && sha256sum -c SHA256SUMS)
            VERIFY_PATH="$(mktemp -d "$BACKUP_ROOT/.restore-check-20260902.XXXXXX")"
            tar -xzf "$BASELINE/release.tgz" -C "$VERIFY_PATH"
            test -d "$VERIFY_PATH/client"
            test -d "$VERIFY_PATH/server"
            test -d "$VERIFY_PATH/node_modules"
            test -f "$VERIFY_PATH/ecosystem.config.cjs"
            test -f "$VERIFY_PATH/package-lock.json"
            tar -dzf "$BASELINE/release.tgz" -C "$VERIFY_PATH"
            if [ "$BASELINE_OPERATION" = restore-marketing-backup ]; then
              RELEASE_PATH="$RELEASES_ROOT/$(date +%Y%m%d%H%M%S)-restored-baseline-20260902"
              test ! -e "$RELEASE_PATH"
              mv -T "$VERIFY_PATH" "$RELEASE_PATH"
              NEXT_LINK="${CURRENT_LINK}.baseline-${{ github.run_id }}"
              test ! -e "$NEXT_LINK"
              test ! -L "$NEXT_LINK"
              ln -s "$RELEASE_PATH" "$NEXT_LINK"
              mv -Tf "$NEXT_LINK" "$CURRENT_LINK"
              if ! pm2 startOrReload "$CURRENT_LINK/ecosystem.config.cjs" --only prohelper-ssr --update-env; then
                ln -s "$CURRENT_RELEASE" "$NEXT_LINK"
                mv -Tf "$NEXT_LINK" "$CURRENT_LINK"
                pm2 startOrReload "$CURRENT_LINK/ecosystem.config.cjs" --only prohelper-ssr --update-env
                exit 1
              fi
              HEALTHY=false
              for attempt in 1 2 3 4 5 6; do
                if curl --connect-timeout 5 --max-time 10 -fsS http://127.0.0.1:3001/ >/dev/null; then
                  HEALTHY=true
                  break
                fi
                sleep 5
              done
              if [ "$HEALTHY" != true ]; then
                ln -s "$CURRENT_RELEASE" "$NEXT_LINK"
                mv -Tf "$NEXT_LINK" "$CURRENT_LINK"
                pm2 startOrReload "$CURRENT_LINK/ecosystem.config.cjs" --only prohelper-ssr --update-env
                exit 1
              fi
              pm2 save
            else
              case "$VERIFY_PATH" in
                "$BACKUP_ROOT"/.restore-check-20260902.*) rm -rf -- "$VERIFY_PATH" ;;
                *) exit 1 ;;
              esac
            fi
            printf 'Baseline: %s\nOriginal release: ' "$BASELINE"
            cat "$BASELINE/original-release.txt"
            cat "$BASELINE/SHA256SUMS"
            printf 'Active release: %s\n' "$(readlink -f "$CURRENT_LINK")"
            du -h "$BASELINE/release.tgz"

  lk-baseline:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'backup-lk' || inputs.target == 'verify-lk-backup' || inputs.target == 'restore-lk-backup')
    runs-on: ubuntu-latest
    steps:
      - name: Validate LK restore request
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_RESTORE: ${{ inputs.confirm_restore }}
        run: |
          if [ "$TARGET" = restore-lk-backup ] && [ "$CONFIRM_RESTORE" != RESTORE-LK-20260904 ]; then
            exit 1
          fi
      - name: Preserve or restore LK baseline
        uses: appleboy/ssh-action@v1.2.0
        env:
          BASELINE_OPERATION: ${{ inputs.target }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          envs: BASELINE_OPERATION
          command_timeout: 20m
          script: |
            set -euo pipefail
            umask 077
            RELEASES_ROOT=/var/www/prohelper_lk/releases
            CURRENT_LINK=/var/www/prohelper_lk/current
            BACKUP_ROOT=/var/backups/most-lk
            BASELINE="$BACKUP_ROOT/before-redesign-20260904"
            CURRENT_RELEASE="$(readlink -f "$CURRENT_LINK")"
            case "$CURRENT_RELEASE" in
              "$RELEASES_ROOT"/*) ;;
              *) echo 'Unexpected LK release path'; exit 1 ;;
            esac
            test -s "$CURRENT_RELEASE/index.html"
            test -d "$CURRENT_RELEASE/assets"
            mkdir -p "$BACKUP_ROOT"
            if [ "$BASELINE_OPERATION" = backup-lk ] && [ ! -e "$BASELINE" ]; then
              STAGING="$(mktemp -d "$BACKUP_ROOT/.baseline-20260904.XXXXXX")"
              tar -czf "$STAGING/release.tgz" -C "$CURRENT_RELEASE" .
              tar -dzf "$STAGING/release.tgz" -C "$CURRENT_RELEASE"
              printf '%s\n' "$CURRENT_RELEASE" > "$STAGING/original-release.txt"
              date -u +%FT%TZ > "$STAGING/created-at.txt"
              (cd "$STAGING" && sha256sum release.tgz > SHA256SUMS)
              mv -T "$STAGING" "$BASELINE"
            fi
            test -d "$BASELINE"
            (cd "$BASELINE" && sha256sum -c SHA256SUMS)
            VERIFY_PATH="$(mktemp -d "$BACKUP_ROOT/.restore-check-20260904.XXXXXX")"
            tar -xzf "$BASELINE/release.tgz" -C "$VERIFY_PATH"
            test -s "$VERIFY_PATH/index.html"
            test -d "$VERIFY_PATH/assets"
            tar -dzf "$BASELINE/release.tgz" -C "$VERIFY_PATH"
            if [ "$BASELINE_OPERATION" = restore-lk-backup ]; then
              RELEASE_PATH="$RELEASES_ROOT/$(date +%Y%m%d%H%M%S)-restored-baseline-20260904"
              test ! -e "$RELEASE_PATH"
              mv -T "$VERIFY_PATH" "$RELEASE_PATH"
              NEXT_LINK="${CURRENT_LINK}.baseline-${{ github.run_id }}"
              test ! -e "$NEXT_LINK"
              test ! -L "$NEXT_LINK"
              ln -s "$RELEASE_PATH" "$NEXT_LINK"
              mv -Tf "$NEXT_LINK" "$CURRENT_LINK"
              if ! test -s "$CURRENT_LINK/index.html" || ! cmp -s "$RELEASE_PATH/index.html" "$CURRENT_LINK/index.html"; then
                ln -s "$CURRENT_RELEASE" "$NEXT_LINK"
                mv -Tf "$NEXT_LINK" "$CURRENT_LINK"
                exit 1
              fi
            else
              case "$VERIFY_PATH" in
                "$BACKUP_ROOT"/.restore-check-20260904.*) rm -rf -- "$VERIFY_PATH" ;;
                *) exit 1 ;;
              esac
            fi
            printf 'Baseline: %s\nOriginal release: ' "$BASELINE"
            cat "$BASELINE/original-release.txt"
            cat "$BASELINE/SHA256SUMS"
            printf 'Active release: %s\n' "$(readlink -f "$CURRENT_LINK")"
            du -h "$BASELINE/release.tgz"

  deploy-marketing:
    if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'marketing'
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
      RELEASES_ROOT: /var/www/prohelper_marketing/releases
      CURRENT_LINK: /var/www/prohelper_marketing/current
      KEEP_RELEASES: '5'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build marketing SSR
        run: |
          npm run build:marketing
          if [ -f server/importBuild.cjs ]; then
            sed -i 's|../../node_modules|../node_modules|g' server/importBuild.cjs
          fi

      - name: Prepare marketing artefact
        run: |
          rm -rf .deploy/marketing
          mkdir -p .deploy/marketing
          cp -R client server assets.json ecosystem.config.cjs package.json package-lock.json .deploy/marketing/
          tar -czf marketing.tgz -C .deploy/marketing .

      - name: Upload marketing artefact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: marketing.tgz
          target: /tmp/

      - name: Deploy marketing on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            SHA_SHORT="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
            RELEASE_ID="$(date +%Y%m%d%H%M%S)-$SHA_SHORT"
            RELEASE_PATH="${{ env.RELEASES_ROOT }}/$RELEASE_ID"
            PREVIOUS_RELEASE="$(readlink -f "${{ env.CURRENT_LINK }}" || true)"

            mkdir -p "${{ env.RELEASES_ROOT }}"
            mkdir -p "$RELEASE_PATH"

            tar -xzf /tmp/marketing.tgz -C "$RELEASE_PATH"
            rm -f /tmp/marketing.tgz

            cd "$RELEASE_PATH"
            npm install --omit=dev --no-audit --no-fund

            ln -sfn "$RELEASE_PATH" "${{ env.CURRENT_LINK }}"

            if pm2 describe prohelper-ssr >/dev/null 2>&1; then
              pm2 startOrReload "${{ env.CURRENT_LINK }}/ecosystem.config.cjs" --only prohelper-ssr --update-env
            else
              pm2 start "${{ env.CURRENT_LINK }}/ecosystem.config.cjs" --only prohelper-ssr --update-env
            fi

            sleep 5

            if ! curl -fsS http://127.0.0.1:3001 >/dev/null; then
              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                ln -sfn "$PREVIOUS_RELEASE" "${{ env.CURRENT_LINK }}"
                pm2 startOrReload "${{ env.CURRENT_LINK }}/ecosystem.config.cjs" --only prohelper-ssr --update-env || true
              fi
              exit 1
            fi

            pm2 save

            ls -1dt "${{ env.RELEASES_ROOT }}"/* | tail -n +$((${{ env.KEEP_RELEASES }} + 1)) | xargs -r rm -rf

  deploy-lk:
    if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'lk'
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
      RELEASES_ROOT: /var/www/prohelper_lk/releases
      CURRENT_LINK: /var/www/prohelper_lk/current
      KEEP_RELEASES: '5'
      VITE_API_URL: https://api.1мост.рф
      VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
      VITE_REVERB_HOST: api.1мост.рф
      VITE_REVERB_PORT: 443
      VITE_REVERB_SCHEME: https
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Reverb configuration
        run: npm run verify:reverb-config

      - name: Build lk
        run: npm run build:lk

      - name: Prepare lk artefact
        run: |
          rm -rf .deploy/lk
          mkdir -p .deploy/lk
          cp -R dist-lk/. .deploy/lk/
          tar -czf lk.tgz -C .deploy/lk .

      - name: Upload lk artefact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: lk.tgz
          target: /tmp/

      - name: Deploy lk on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            SHA_SHORT="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
            RELEASE_ID="$(date +%Y%m%d%H%M%S)-$SHA_SHORT"
            RELEASE_PATH="${{ env.RELEASES_ROOT }}/$RELEASE_ID"
            PREVIOUS_RELEASE="$(readlink -f "${{ env.CURRENT_LINK }}" || true)"

            mkdir -p "${{ env.RELEASES_ROOT }}"
            mkdir -p "$RELEASE_PATH"

            tar -xzf /tmp/lk.tgz -C "$RELEASE_PATH"
            rm -f /tmp/lk.tgz

            if [ ! -f "$RELEASE_PATH/index.html" ]; then
              rm -rf "$RELEASE_PATH"
              exit 1
            fi

            ln -sfn "$RELEASE_PATH" "${{ env.CURRENT_LINK }}"

            if [ ! -f "${{ env.CURRENT_LINK }}/index.html" ]; then
              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                ln -sfn "$PREVIOUS_RELEASE" "${{ env.CURRENT_LINK }}"
              fi
              exit 1
            fi

            ls -1dt "${{ env.RELEASES_ROOT }}"/* | tail -n +$((${{ env.KEEP_RELEASES }} + 1)) | xargs -r rm -rf
